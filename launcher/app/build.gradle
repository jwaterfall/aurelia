plugins {
    id 'com.android.application'
}

android {
    namespace 'app.aurelia.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.aurelia.tv'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.4'
    }

    buildFeatures {
        // VERSION_NAME, which the launcher reports to Jellyfin when it signs in.
        buildConfig true
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Jellyfin playback (PlayerActivity): ExoPlayer, HLS for streams the server transcodes, and PlayerView for the
    // video surface and subtitles. 1.4 is the last line that builds against compileSdk 34.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for JVM tests (Android's is a stub there): the Jellyfin device profile is JSON.
    testImplementation 'org.json:json:20231013'
}
