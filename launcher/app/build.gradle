plugins {
    id 'com.android.application'
}

// Jellyfin server and credentials for the Continue Watching row, from launcher/jellyfin.properties. That file is
// gitignored so the API key never reaches the repository; copy jellyfin.properties.example to start one.
// Without it the build still works and the row reports that Jellyfin is not set up.
def jellyfin = new Properties()
def jellyfinFile = rootProject.file('jellyfin.properties')
if (jellyfinFile.exists()) jellyfinFile.withInputStream { jellyfin.load(it) }
def jellyfinField = { String key -> '"' + jellyfin.getProperty(key, '').trim().replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.4'

        buildConfigField 'String', 'JELLYFIN_SERVER', jellyfinField('server')
        buildConfigField 'String', 'JELLYFIN_USER_ID', jellyfinField('userId')
        buildConfigField 'String', 'JELLYFIN_API_KEY', jellyfinField('apiKey')
        // Name on the profile button in the top bar; the button is hidden without one.
        buildConfigField 'String', 'PROFILE_NAME', jellyfinField('profileName')
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
