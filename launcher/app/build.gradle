plugins {
    id 'com.android.application'
}

// The version: from the release tag on GitHub (-PversionName=2.5.0, see .github/workflows/release.yml), else the
// default here for builds on this machine. The code follows the name, so each release installs over the last.
def appVersion = (findProperty('versionName') ?: '2.5.0').toString()
def versionParts = (appVersion.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 } + [0, 0, 0]).take(3)
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// The release key: from ~/.gradle/gradle.properties here, from secrets on GitHub (AURELIA_* in both). Without it,
// builds fall back to this machine's debug key, as they always did.
def releaseKey = findProperty('AURELIA_KEYSTORE') ?: System.getenv('AURELIA_KEYSTORE')
def secret = { String name -> (findProperty(name) ?: System.getenv(name))?.toString() }

android {
    namespace 'app.aurelia.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'app.aurelia.tv'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
        // Where updates come from: this repository's GitHub releases (update.Updates).
        buildConfigField 'String', 'UPDATE_REPO', '"jwaterfall/aurelia"'
        // ARM TVs only (the Chromecast is 32-bit): the FFmpeg decoder's x86 builds would double the APK for nothing.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildFeatures {
        // VERSION_NAME, which the launcher reports to Jellyfin when it signs in.
        buildConfig true
    }

    signingConfigs {
        if (releaseKey) {
            release {
                storeFile file(releaseKey)
                storePassword secret('AURELIA_KEYSTORE_PASSWORD')
                keyAlias secret('AURELIA_KEY_ALIAS')
                keyPassword secret('AURELIA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Signed as releases are, so a build from here installs over one the TV updated itself to.
            if (releaseKey) signingConfig signingConfigs.release
        }
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Jellyfin playback (PlayerActivity): ExoPlayer, HLS for streams the server transcodes, and PlayerView for the
    // video surface and subtitles.
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    // Jellyfin's own build of ExoPlayer's FFmpeg audio decoder (GPL-3.0), as its Android TV app uses: Dolby, DTS and
    // TrueHD decoded on the TV, which has no decoder of its own for them, so they play as they are with volume
    // levelling on, or with no amplifier to pass them to. Its version follows Media3's.
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.8.0+1'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for JVM tests (Android's is a stub there): the Jellyfin device profile is JSON.
    testImplementation 'org.json:json:20231013'
}
