name: Release

# A tag like v2.5.0 builds the launcher at that version, signed with the release key, and publishes it as a
# GitHub release with the APK attached. TVs running Aurelia find it there (update.Updates) and offer it.
#
#   git tag v2.5.0 && git push fork v2.5.0
#
# Only someone who can push to this repository can push a tag, so only they can publish a release; pull requests
# from forks never see the secrets. The actions below are pinned to exact commits, so a later change to one of
# them cannot reach the release key.
#
# Secrets (Settings → Secrets and variables → Actions):
#   AURELIA_KEYSTORE_BASE64    the release keystore, base64-encoded
#   AURELIA_KEYSTORE_PASSWORD  its password
#   AURELIA_KEY_ALIAS          the key's alias
#   AURELIA_KEY_PASSWORD       the key's password

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.AURELIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The AURELIA_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aurelia-release.jks"
          echo "AURELIA_KEYSTORE=$RUNNER_TEMP/aurelia-release.jks" >> "$GITHUB_ENV"

      - name: Tests and the signed release
        working-directory: launcher
        env:
          AURELIA_KEYSTORE_PASSWORD: ${{ secrets.AURELIA_KEYSTORE_PASSWORD }}
          AURELIA_KEY_ALIAS: ${{ secrets.AURELIA_KEY_ALIAS }}
          AURELIA_KEY_PASSWORD: ${{ secrets.AURELIA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PversionName="${GITHUB_REF_NAME#v}" testReleaseUnitTest assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="aurelia-$version.apk"
          cp launcher/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Aurelia $version" --generate-notes
